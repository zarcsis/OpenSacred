# Dependency checks: `cargo deny check` (docs/03 §3.4). Run locally and in CI.

[graph]
all-features = true

[advisories]
# RustSec database: vulnerabilities, yanked versions, unmaintained crates.
ignore = []

[licenses]
# Our crates are MIT OR Apache-2.0. GPL only under opensacred-oracle (Unicorn, GPL-2.0), a
# development tool kept out of the converter and the game, via the exceptions below.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The Boost Software License: permissive like MIT, and asks nothing of compiled code, only that
    # copies of the sources keep their notice. clipboard-win and error-code, under arboard, are the
    # Windows backend of Bevy's system clipboard, which the console pastes from (#189).
    "BSL-1.0",
    # Permissive like MIT; required by Bevy (ADR-04): libloading under ash (Vulkan) and inotify
    # under gilrs are ISC, encase (the shader data layout of bevy_render) is MIT-0.
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    # Unicode data in unicode-ident, pulled in by any procedural macro (syn, clap_derive)
    "Unicode-3.0",
    "Zlib",
]
# The list is a policy for the future; not every license occurs yet.
unused-allowed-license = "allow"
confidence-threshold = 0.8
# Unicorn, the emulator of opensacred-oracle alone (docs/04 §2.3), is GPL-2.0, which the Apache-2.0
# option cannot be combined with. The oracle has no library, so no crate of the converter or the
# game can depend on it, and `bans.deny` below keeps Unicorn under it. Both crates name the
# license by its deprecated identifier, which cargo deny warns of.
exceptions = [
    { crate = "unicorn-engine", allow = ["GPL-2.0"] },
    { crate = "unicorn-engine-sys", allow = ["GPL-2.0"] },
]

[bans]
multiple-versions = "warn"
# Unicorn (GPL-2.0, the exceptions above) only as the dependency of opensacred-oracle.
deny = [
    { crate = "unicorn-engine", wrappers = ["opensacred-oracle"] },
    { crate = "unicorn-engine-sys", wrappers = ["unicorn-engine"] },
]
# png 0.18.1, the latest release, uses miniz_oxide 0.8 directly and 0.9 through flate2 1.1.10, so
# the duplicate comes from png alone. png's master no longer depends on miniz_oxide directly
# (checked 2026-10-16): remove the entry after the next png release; cargo deny then reports the
# skip as unused.
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 needs 0.8 directly and 0.9 through flate2; fixed in png master, not released yet" },
]
wildcards = "deny"
# Path dependencies between workspace crates carry no version; allowed because the crates are
# private (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
