[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zarcsis/OpenSacred"
publish = false

[workspace.dependencies]
opensacred-data = { path = "crates/opensacred-data" }
opensacred-formats = { path = "crates/opensacred-formats" }
opensacred-locate = { path = "crates/opensacred-locate" }
opensacred-rules = { path = "crates/opensacred-rules" }
opensacred-scripts = { path = "crates/opensacred-scripts" }

anyhow = "1.0.104"
# A BC7 decoder, for the tests of the converter's textures (#700).
bcdec_rs = "0.2.1"
# The engine of the game (ADR-04). The default collections ("2d", "3d", "ui", "audio") minus: the
# Wayland backend, whose client-side decorations pull the unmaintained ttf-parser (Linux runs
# through X11 and XWayland); zstd_rust, whose ruzstd 0.8 has RUSTSEC-2026-0344 (zstd_c decodes
# the KTX2 tone-mapping tables instead); webgl2, the browser version being dropped (PLAN.md
# §1.1); Bevy's audio (sound goes through Kira, ADR-07); 2D rendering, and the picking of meshes
# and sprites, until they are needed. Plus png, for the converted interface textures that the HUD loads; the picking of the
# interface's nodes, which the menus' items take their pointing and clicks from; the Remote
# Protocol of `--remote` (docs/10 §8); and the system's clipboard, which the console pastes from.
bevy = { version = "0.20.0", default-features = false, features = [
    "async_executor",
    "bevy_anti_alias",
    "bevy_asset",
    "bevy_clipboard",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_light",
    "bevy_log",
    "bevy_mikktspace",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_remote",
    "bevy_render",
    "bevy_state",
    "bevy_winit",
    "common_api",
    "custom_cursor",
    "default_font",
    "gltf_animation",
    "ktx2",
    "morph",
    "morph_animation",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "scene",
    "smaa_luts",
    "std",
    "sysinfo_plugin",
    "system_clipboard",
    "tonemapping_luts",
    "ui_api",
    "ui_bevy_render",
    "ui_picking",
    "x11",
    "zstd_c",
] }
# Sound (ADR-07): Kira through Bevy. The game's sound is Ogg Opus (#701), which the game decodes
# itself (`opus`) into Kira's static sounds; bevy_kira_audio builds only with a format of its own,
# and Ogg Vorbis adds the least, Symphonia's Ogg demuxer being the game's already.
bevy_kira_audio = { version = "0.27.1", default-features = false, features = ["ogg"] }
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
fluent-syntax = "0.12.0"
# The free space of the disk that the player's conversion writes to (#1497).
fs4 = "1.1.0"
# The BC7 encoder of the converter's textures (#700): Intel's ISPC Texture Compressor, its
# kernels prebuilt for Windows, Linux and macOS, so that no ISPC is needed.
intel_tex_2 = "0.5.0"
# Kira's static sounds, which the game's Opus loader makes (#701).
kira = { version = "0.12.5", default-features = false }
# The reader of the KTX2 textures, Bevy's own, which the tests check the writer against (#700).
ktx2 = "0.5.0"
# The scripts in Luau (#720): the converter compiles its translation of the NetScript (#723), the
# game runs it; Luau's sources are built in, MIT like mlua.
mlua = { version = "0.12.2", features = ["luau"] }
# Direct rather than through flate2: inflate with an output limit is exactly what TEX needs.
miniz_oxide = { version = "0.9.1", features = ["simd"] }
png = "0.18.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# The property tests of the rules (#1428), a dev-dependency: without the forking and the timeouts
# of a case, which the formulas do not need.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The open formats' types made at random for their round trips (#1434), a dev-dependency of
# opensacred-data.
proptest-derive = "0.9.0"
rayon = "1.12.0"
# The packaged game's folder dialog at its first start on Windows (#1498), on the windows-sys
# and raw-window-handle that the tree holds.
rfd = { version = "0.17.2", default-features = false }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# The Ogg demuxer of the game's Opus (#701), and the Opus decoder for it, over the C libopus that
# its `opusic-sys` builds with CMake.
symphonia = { version = "0.6.1", default-features = false, features = ["ogg"] }
symphonia-adapter-libopus = "0.3.0"
thiserror = "2.0.21"
# The game's settings file (docs/10 §3): read through serde, written key by key keeping the
# user's comments and order, which the toml crate does not keep.
toml_edit = { version = "0.25.17", features = ["serde"] }
# The emulator of opensacred-oracle alone (GPL-2.0, docs/04 §2.3), the 32-bit x86 of Sacred.exe.
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
# The converter's search for the player's installation in the registry on Windows (#1496), on the
# windows-sys that the tree already holds.
winreg = "0.56.0"
# The KTX2 textures' supercompression (#700), on the C library (`zstd-sys`) that Bevy's `zstd_c`
# already builds; Bevy 0.20 binds it through zstd 0.13, so both versions of the binding stay in
# the tree until Bevy moves (#826).
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
# No unsafe in our code (CLAUDE.md): opensacred-oracle's Unicorn wrapper needs none either.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `as` casts when parsing binary fields: truncation, sign change, widening without From.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# An error must name the file and the record instead of panicking; allowed in tests (clippy.toml).
expect_used = "warn"
unwrap_used = "warn"
# A lint is silenced only with `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Leftover debugging.
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized in debug builds: the converter pushes gigabytes through zlib and
# PNG, while our own code stays easy to debug (docs/03 §5).
[profile.dev.package."*"]
opt-level = 3

# The build that the releases ship (#1500): the release profile with link-time optimization across
# the crates, one code generation unit and the symbols stripped, for a smaller and faster
# executable at the price of a longer build.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
