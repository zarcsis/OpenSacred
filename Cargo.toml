[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zarcsis/OpenSacred"
publish = false

[workspace.dependencies]
opensacred-data = { path = "crates/opensacred-data" }
opensacred-formats = { path = "crates/opensacred-formats" }

anyhow = "1.0.104"
# The engine of the game (ADR-04). The default collections ("2d", "3d", "ui", "audio") minus: the
# Wayland backend, whose client-side decorations pull the unmaintained ttf-parser (Linux runs
# through X11 and XWayland); zstd_rust, whose ruzstd 0.8 has RUSTSEC-2026-0344 (zstd_c decodes
# the KTX2 tone-mapping tables instead); webgl2 until the web build; Bevy's audio (sound goes
# through Kira, ADR-07); 2D rendering, and the picking of meshes and sprites, until they are
# needed. Plus png, for the converted interface textures that the HUD loads, and the picking of
# the interface's nodes, which the menus' items take their pointing and clicks from.
bevy = { version = "0.20.0", default-features = false, features = [
    "async_executor",
    "bevy_anti_alias",
    "bevy_asset",
    "bevy_clipboard",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_light",
    "bevy_log",
    "bevy_mikktspace",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_render",
    "bevy_state",
    "bevy_winit",
    "common_api",
    "custom_cursor",
    "default_font",
    "gltf_animation",
    "ktx2",
    "morph",
    "morph_animation",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "scene",
    "smaa_luts",
    "std",
    "sysinfo_plugin",
    "tonemapping_luts",
    "ui_api",
    "ui_bevy_render",
    "ui_picking",
    "x11",
    "zstd_c",
] }
# Sound (ADR-07): Kira through Bevy; the converted samples are FLAC and MP3.
bevy_kira_audio = { version = "0.27.1", default-features = false, features = ["flac", "mp3"] }
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
fluent-syntax = "0.12.0"
# Direct rather than through flate2: inflate with an output limit is exactly what TEX needs.
miniz_oxide = { version = "0.9.1", features = ["simd"] }
png = "0.18.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rayon = "1.12.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# The game's settings file (docs/10 §3): read through serde, written key by key keeping the
# user's comments and order, which the toml crate does not keep.
toml_edit = { version = "0.25.17", features = ["serde"] }

[workspace.lints.rust]
# unsafe is allowed only in the future opensacred-oracle (CLAUDE.md)
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `as` casts when parsing binary fields: truncation, sign change, widening without From.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# An error must name the file and the record instead of panicking; allowed in tests (clippy.toml).
expect_used = "warn"
unwrap_used = "warn"
# A lint is silenced only with `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Leftover debugging.
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized in debug builds: the converter pushes gigabytes through zlib and
# PNG, while our own code stays easy to debug (docs/03 §5).
[profile.dev.package."*"]
opt-level = 3
