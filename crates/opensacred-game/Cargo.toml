[package]
name = "opensacred-game"
description = "The game on Bevy: renders the converted assets of assets/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The version from Git, shared by the two binaries (build.rs)
build = "../../build.rs"

[features]
# The build that the releases ship (#1495): no console window, and the assets by default in the
# user's data directory (%LOCALAPPDATA%\OpenSacred\assets).
packaged = []

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bevy_kira_audio.workspace = true
clap.workspace = true
kira.workspace = true
opensacred-data.workspace = true
opensacred-rules.workspace = true
# The scripts in Luau (#726): Luau built from mlua's vendored sources, so the game needs a C++
# compiler too.
opensacred-scripts.workspace = true
png.workspace = true
rayon.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
swash.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus.workspace = true
toml_edit.workspace = true

[target.'cfg(windows)'.dependencies]
rfd.workspace = true

[lints]
workspace = true
