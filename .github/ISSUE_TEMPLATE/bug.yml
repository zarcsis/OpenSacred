name: Bug
description: The game, the converter or the tools do something wrong.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What OpenSacred does, and what you expected instead; where it shows on the screen or in the sound, a screenshot or a short video of it (PNG, JPEG, MP4, MOV or WebM), and the original's beside it where that tells.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original does
      description: How Sacred Gold 2.28 behaves in the same situation, in your own words, if it matters here.
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands, from a converted `assets/`, and what to do in the game.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The version (the release's name, or `opensacred-game --version`), Windows, the GPU, and whether Sacred Gold is GOG's or Steam's.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the newest file of `%LOCALAPPDATA%\OpenSacred\logs` (look it over for anything private first), or paste the lines about the problem; a save that shows it, zipped, from `%APPDATA%\OpenSacred\saves`, helps too.
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: This issue has no game files, converted assets or game texts; screenshots and videos of the game in play only as attachments (docs/08 §3).
          required: true
