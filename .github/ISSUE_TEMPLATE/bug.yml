name: Bug
description: The game, the converter or the tools do something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What OpenSacred does, and what you expected instead; where it shows on the screen, a frame of it, cropped to it (and the original's beside it where that tells).
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original does
      description: How Sacred Gold 2.28 behaves in the same situation, in your own words, if it matters here.
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands, from a converted `assets/`, and what to do in the game.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The version (`opensacred-game --version` or `opensacred-convert --version`), the OS, the GPU.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: This issue has no game files, converted assets or game texts; a frame only of its problem, cropped to it, as an attachment (docs/08 §3).
          required: true
