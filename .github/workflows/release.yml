# Versions (docs/03 §3.6): a merged pull request labeled `feature` raises the minor version, one
# labeled `bug` the patch; the other labels leave it. A version is an annotated tag vX.Y.Z on the
# pull request's squash commit. At most one release a day (#1548): a scheduled run versions the
# pull requests merged since the last tag once the newest release is a day old, and publishes the
# newest version alone, as a GitHub Release whose notes list the pull requests since the previous
# release (.github/release.yml); before 1.0.0, a pre-release. The versions between two releases stay
# tags. A manual run, `gh workflow run release.yml`, releases at once; the major version is raised
# only at the maintainer's request: `gh workflow run release.yml -f bump=major` tags the head of main.
# The newest version that a run publishes gets the player's archive (#1500, #1494): the game in its
# packaged build and the converter, in the dist profile, our FFmpeg (ffmpeg.yml, #1499), the licenses
# and a read-me, in a 7z attached to the release with the FFmpeg build's source archives.
name: Release

on:
  schedule:
    - cron: '41 * * * *' # every hour; a run releases only once the newest release is a day old
  workflow_dispatch:
    inputs:
      bump:
        description: The part of the version to raise on the head of main, beyond the labels' versions
        type: choice
        options: [none, major, minor, patch]
        default: none

permissions:
  contents: write # the tags and the releases
  pull-requests: read # the labels of the merged pull requests

jobs:
  release:
    name: Release
    # Not in forks; a manual run only on main.
    if: github.repository == 'zarcsis/OpenSacred' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One versioning at a time, so that two runs never both find the newest release a day old.
    # GitHub keeps only the newest pending run of a group and cancels the others, so the archive's
    # build stays outside the group: a manual run pending behind a build of half an hour would be
    # cancelled by the next hour's run.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # The newest release: its version starts the next one's notes, and a scheduled run releases
      # only once it is a day old.
      - name: Newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          newest=$(gh release list --exclude-drafts --limit 10000 --json tagName,publishedAt \
            --jq 'max_by(.publishedAt) | "\(.tagName) \(.publishedAt)"')
          read -r tag published <<< "$newest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == schedule ]] && (( $(date +%s) - $(date -d "$published" +%s) < 24 * 60 * 60 )); then
            echo "$tag was published at $published, less than a day ago."
          else
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.newest.outputs.due
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history and the tags
      - if: steps.newest.outputs.due
        name: Tag and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          RELEASED: ${{ steps.newest.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          last=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | sed -n 1p)
          if [[ -z $last ]]; then
            echo '::error::main has no version tag v*'
            exit 1
          fi

          # Tags commit $1 with the next version, raising part $2, the message $3.
          tags=()
          version() {
            local major minor patch
            IFS=. read -r major minor patch <<< "${last#v}"
            case $2 in
              major) last=v$((major + 1)).0.0 ;;
              minor) last=v$major.$((minor + 1)).0 ;;
              patch) last=v$major.$minor.$((patch + 1)) ;;
            esac
            git tag -a "$last" -m "$3" "$1"
            tags+=("refs/tags/$last")
          }

          for commit in $(git rev-list --reverse --first-parent "$last..HEAD"); do
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" \
              --jq ".[] | select(.merge_commit_sha == \"$commit\") | .labels[].name")
            if grep -qx feature <<< "$labels"; then
              version "$commit" minor "$(git log -1 --format=%s "$commit")"
            elif grep -qx bug <<< "$labels"; then
              version "$commit" patch "$(git log -1 --format=%s "$commit")"
            fi
          done

          if [[ -n $BUMP && $BUMP != none ]]; then
            version HEAD "$BUMP" "The $BUMP version, raised at the maintainer's request"
          fi

          if (( ${#tags[@]} )); then
            git push --atomic origin "${tags[@]}"
          fi

          # The newest version is released with the pull requests since the previous release, before
          # 1.0.0 as a pre-release, and gets the archive. A run that pushed its tags but failed before
          # the release leaves the release to the next run.
          if [[ $last != "$RELEASED" ]]; then
            options=(--verify-tag --title "$last" --generate-notes --notes-start-tag "$RELEASED")
            if [[ $last == v0.* ]]; then options+=(--prerelease); fi
            gh release create "$last" "${options[@]}"
            echo "tag=$last" >> "$GITHUB_OUTPUT"
          fi

  ffmpeg:
    name: FFmpeg
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/ffmpeg.yml

  archive:
    name: Archive
    needs: [release, ffmpeg]
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0 # git describe, the executables' versions
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        run: cargo build --profile dist -p opensacred-game --features opensacred-game/packaged -p opensacred-convert
      - uses: actions/download-artifact@v7
        with:
          name: ffmpeg-windows-x64
          path: ffmpeg
      # The archive's folder: the programs, the licenses, the notices and the read-me; no file of
      # the game (docs/08 §3, §4).
      - name: Archive and attach
        shell: pwsh
        run: |
          $name = "OpenSacred-$env:TAG-windows-x64"
          $dir = New-Item -ItemType Directory -Force $name
          Copy-Item target\dist\opensacred-game.exe, target\dist\opensacred-convert.exe, ffmpeg\ffmpeg.exe, ffmpeg\FFMPEG.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md, release\README.txt $dir
          Copy-Item release\FiraMono-LICENSE.txt "$dir\FiraMono-LICENSE.txt"
          Copy-Item -Recurse ffmpeg\licenses "$dir\ffmpeg-licenses"
          cargo about generate -c release\about.toml --workspace release\about.hbs -o "$dir\THIRD-PARTY-LICENSES.html"
          if ($LASTEXITCODE) { throw 'cargo about' }
          7z a -t7z -m0=lzma2 -mx=9 "$name.7z" $name
          if ($LASTEXITCODE) { throw '7z' }
          gh release upload $env:TAG "$name.7z" (Get-ChildItem ffmpeg\sources\*).FullName --clobber
          if ($LASTEXITCODE) { throw 'gh release upload' }
          Get-Item "$name.7z" | Format-Table Name, Length
