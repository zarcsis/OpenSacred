# Checks on every pull request and on main (docs/03 §5): formatting, clippy, tests without game files on Linux
# and Windows, cargo deny. The ruleset on main requires the Linux, Windows and cargo deny checks (docs/03 §3.6).
# CI has no game files; the tests that need them are #[ignore] and run locally (docs/08 §4).
name: CI

on:
  # Branches other than main run through their pull request only, so a push to one runs CI once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its run; every run on main completes and saves the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info: with it, the test build of Bevy (its dependencies at opt-level 3) takes most of
  # the runner's free disk and its links are slow, and CI needs no debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # The dependencies' build is kept even when a check fails: rebuilding Bevy takes a quarter of
      # an hour. Only main saves it: pull requests restore main's cache, and caches of their own
      # would push main's out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # opensacred-game (Bevy): gamepad support (gilrs) links libudev, sound (Kira through cpal) ALSA; X11
      # and Vulkan load at run time, the screenshot test's on Mesa's software Vulkan (lavapipe). The
      # packages that the image lacks are cached by the image's version, so the Ubuntu mirror, minutes
      # slow in some runs, is reached once an image (#1109); only main saves, as for the build above.
      - id: image
        run: echo "apt=apt-$ImageOS-$ImageVersion-1" >> "$GITHUB_OUTPUT"
      - id: apt
        uses: actions/cache/restore@v6
        with:
          path: ~/apt
          key: ${{ steps.image.outputs.apt }}
      - if: steps.apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only libasound2-dev libudev-dev pkg-config libvulkan1 mesa-vulkan-drivers
          mkdir -p ~/apt
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/apt/ \;
      - if: steps.apt.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/apt
          key: ${{ steps.image.outputs.apt }}
      - run: if ls ~/apt/*.deb > /dev/null 2>&1; then sudo dpkg -i ~/apt/*.deb; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # The screenshot test of opensacred-game's scene renders a synthetic world without a window, on
      # Mesa's software Vulkan (lavapipe). It runs over the whole workspace, as the step above:
      # `-p opensacred-game` alone unifies the dependencies' features differently and rebuilds Bevy.
      - run: cargo nextest run --workspace --run-ignored only -E 'test(the_scene_matches_its_screenshot)'

  # The target platform: the build (rust-lld, .cargo/config.toml) and the tests. No clippy: the
  # workspace has no Windows-only code, so it would report what the Linux job does, at the cost of a
  # second build of the dependencies. No screenshot test: the runner has no GPU.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
